# Runs on every push and pull request, before Railway or Vercel deploy
# anything.
#
# This exists because of a specific, repeated pattern: a change would land,
# deploy, and the only way anyone found out it had broken generation was the
# owner paying for a trip, opening it, and noticing something wrong in a
# screenshot - sometimes weeks later. Three latency regressions and a broken
# accommodation lookup all reached production that way.
#
# Every check below runs without an API key and without touching Redis, so
# the whole suite is free and takes seconds. That is deliberate: a test
# suite that costs money per run is a test suite nobody runs.

name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  worker:
    name: worker - typecheck + pipeline & quality suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # The acceptance gate against itineraries broken in each of the ways
      # this product has actually shipped broken.
      - run: npm run test:quality
      # The real pipeline over a realistic fake generation, reading the
      # finished trip. This is the one that catches the small, visible
      # mistakes that used to be found only by paying for a generation and
      # spotting them on the page.
      - run: npm run test:itinerary
      # The trip shapes the other suites don't cover: Bulgarian, multi-city,
      # accommodation or travel already booked, a single day.
      - run: npm run test:edges
      # Whether the stages that must overlap actually overlap. A
      # serialization regression shows up here as a wall-clock number, with
      # no model call involved.
      - run: npm run test:pipeline

  frontend:
    name: frontend - typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Every text color in the palette against the backgrounds it's
      # actually painted on. --ink-dim - the color of nearly every label,
      # date and helper line in the product - shipped for months at
      # 3.28:1, under the 4.5:1 WCAG AA needs for body text, and the only
      # thing that would have caught it was someone noticing. Pure
      # arithmetic over the stylesheet: no browser, no network, runs in
      # milliseconds.
      - run: npm run check:contrast
      # No em dashes anywhere in the repo. It is the single most
      # recognisable sign that a line of text was written by a model, and
      # this product asks travelers to read its output as advice from a
      # person. The prompts ask the model not to write one and the worker
      # strips any that survive; this covers the copy we write ourselves.
      - run: npm run check:dashes
      # The trip cover's list of which cities have a photo is a hand-copy
      # of a directory listing, because the trip page is client-rendered
      # and cannot read the filesystem. This is what stops it drifting.
      - run: npm run check:covers
      # Catches what typecheck alone misses - a server component importing
      # something client-only, a bad route export, a failed page render.
      - run: npm run build
        env:
          # The build must not require real credentials. Anything that needs
          # them is behind a runtime check, not a build-time one; if this
          # step ever starts needing a secret, that's the bug.
          NEXT_TELEMETRY_DISABLED: "1"
