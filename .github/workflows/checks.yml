# Runs on every push and pull request, before Railway or Vercel deploy
# anything.
#
# This exists because of a specific, repeated pattern: a change would land,
# deploy, and the only way anyone found out it had broken generation was the
# owner paying for a trip, opening it, and noticing something wrong in a
# screenshot - sometimes weeks later. Three latency regressions and a broken
# accommodation lookup all reached production that way.
#
# Every check below runs without an API key and without touching Redis, so
# the whole suite is free and takes seconds. That is deliberate: a test
# suite that costs money per run is a test suite nobody runs.

name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  worker:
    name: worker - typecheck + pipeline & quality suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # The linter, which until this commit did not run.
      #
      # `npm run lint` had been `eslint .` with no config file anywhere, so
      # it exited on ESLint 9's "couldn't find a configuration file" and
      # checkCiScripts.mjs excused it as "not yet enforced". A repo with
      # sixteen hundred assertions and 51 CI steps had no linter at all:
      # TypeScript checked types and nothing checked anything else.
      #
      # Tuned for what it can catch rather than for completeness, because a
      # linter's failure mode is being switched off. The rules are the ones
      # that map onto defects this product has actually shipped - floating
      # promises (the worker runs four jobs at once and an unobserved
      # rejection takes the others down; this needed a hand-written
      # `.catch(() => {})` twice in one session), `!= null` guards that let
      # NaN through into a cached price, the coercing isNaN/isFinite
      # globals, shadowed names, unused bindings - all errors. Style is off:
      # react/no-unescaped-entities alone was 23 of the first run's 42
      # errors, every one a straight apostrophe in the terms page.
      #
      # It found real things on the first run: dead code in DayMap, a
      # `useExample` that was not a hook and so made the react-hooks rule
      # report a false positive on the file it protects, `t` shadowed by the
      # job's timings in TripView, four unobserved promises, a stale-language
      # error message in CompareView, and a JOB_TTL_SECONDS import left
      # dead by my own change two commits earlier.
      #
      # Cost of the type-aware rules, measured rather than assumed: 4.3s
      # for this package's 40-odd source files, against a job that already
      # spends minutes on npm ci and the suites.
      - run: npm run lint
      # The acceptance gate against itineraries broken in each of the ways
      # this product has actually shipped broken.
      # Two changes worth naming, both from a live run.
      #
      # The gate was CONTRADICTING THE PROMPT. buildPrompt tells the model
      # "an early departure means the last day is mostly travel and should
      # be planned as such", and to drop meals the departure removes. A real
      # Rome trip with a 09:00 flight home did exactly that - breakfast and
      # the airport run - and the gate called it a defect, because the
      # activity floor was a constant that knew nothing about when the
      # traveler leaves. The same conflict had already been found and fixed
      # once for meals; this is the other half. It only ever LOWERS a floor,
      # so it cannot invent a finding, and the suite asserts that both ways:
      # a 09:00 flight exempts the day, a 22:00 one does not.
      #
      # And the FRAME'"'"'S HALF, which nothing scored. trip_summary,
      # key_decisions, things_to_skip and the budget minimum were read in
      # exactly one place in quality.ts - as a substring haystack for
      # must-see coverage - so the half the product is sold on ("your job is
      # not to list options, it is to DECIDE and justify") had no automated
      # signal at all. Three contract checks, not taste checks: a decision
      # with no reason, a skip with no reason, a minimum below the beds in
      # its own itinerary. Deliberately no minimum-length bar on the
      # reasoning - "Too far." is eight characters and a complete answer,
      # and this file'"'"'s own rule is that a false alarm trains you to ignore
      # it.
      #
      # Reverting the departure fix makes 3 of 111 red; removing the frame
      # checks makes 6 - measured.
      - run: npm run test:quality
      # The real pipeline over a realistic fake generation, reading the
      # finished trip. This is the one that catches the small, visible
      # mistakes that used to be found only by paying for a generation and
      # spotting them on the page.
      - run: npm run test:itinerary
      # The trip shapes the other suites don't cover: Bulgarian, multi-city,
      # accommodation or travel already booked, a single day.
      - run: npm run test:edges
      # Whether the stages that must overlap actually overlap. A
      # serialization regression shows up here as a wall-clock number, with
      # no model call involved.
      - run: npm run test:pipeline
      # The failure diagnostics, driven through the real processJob.
      #
      # A failed generation tells the traveler one of seven sentences and
      # the seventh explains nothing, so the real error and stack are now
      # written to a capped Redis list and rendered on /admin/health -
      # behind the password, never on the job record, which
      # /api/job/[id] serves unauthenticated to anyone holding the link.
      #
      # Three properties: the record carries the error's own CLASS name
      # (every custom error here is `class X extends Error {}` and none set
      # `name`, so the field the operator reads first said "Error" for all
      # of them until nameOfThrown existed); a successful generation
      # records nothing; and a Redis that refuses the write does not turn
      # one failure into two - recordWorkerFailure is awaited inside
      # processJob after its catch has run, so a throw there would escape
      # and leave the job at "running" for the four minutes
      # STALE_RUNNING_MS allows.
      #
      # It also drives nine shapes of MODEL RESPONSE through processJob,
      # which found four more routes to that seventh sentence. `content`
      # is declared an array, `.text` a string and `usage` an object, all
      # asserted over an API payload and read in seven places: a string
      # `content` gave ".filter is not a function", a numeric `.text` gave
      # "text.matchAll is not a function", and a response with no `usage`
      # gave "reading 'server_tool_use' of undefined" - that last one
      # thrown by estimateCostUsd, so the ACCOUNTING killed the job and
      # the traveler was told the itinerary failed by the code that adds
      # up the bill. All of them now read as an empty text block or a zero
      # cost, which fails extractJson and produces the named
      # malformed-output error with a retry behind it. Reverting the
      # guards makes 5 of 41 red.
      #
      # What is deliberately NOT guarded: a null response object. The SDK
      # returns a Message or throws, and the only way to produce one is to
      # replace the whole `messages` object, which nothing in production
      # does.
      #
      # AND THE ONE THAT BROKE EVERY GENERATION. streamMessage built its
      # request options as `{ timeout: options?.timeout }` unconditionally,
      # and the SDK validates that option by PRESENCE OF THE KEY
      # (client.ts): `if ('timeout' in options) validatePositiveInteger(
      # 'timeout', options.timeout)`. `'timeout' in { timeout: undefined }`
      # is true and validatePositiveInteger throws on undefined, so every
      # streamed call - all three callers reach it without a timeout -
      # threw "timeout must be an integer" in buildRequest, before any HTTP
      # request was made. AnthropicError is the SDK's base class and not an
      # APIError, so it matched none of the named cases and every traveler
      # got "Unexpected error generating itinerary." after 6ms.
      #
      # The stub here reproduces that one SDK line and nothing else, so the
      # assertion is about the provider's contract rather than the shape of
      # our own code. Reverting the fix makes 2 of 47 red. Found by booting
      # the worker against a local Redis with an invalid key and reading
      # the failure record it wrote, and confirmed fixed the same way -
      # where the same job then came back "Server is misconfigured (invalid
      # API key)."
      - run: npm run test:failure-log
      # The brief the worker takes off the queue, and the write that has to
      # land. Both found by injecting faults into the real processJob.
      #
      # readJobRecord checks that `brief` is an object and stops, because
      # parseTripBrief owns the contents - on the OTHER deployment, before
      # enqueue. This process takes whatever is on the queue, and five
      # shapes broke it, each one a single wrong type on a list field. `{}`,
      # `destinations: "Rome"` and a null inside destinations all threw
      # BEFORE processJob's try, so nothing marked the job failed: the
      # record sat at "running" until stallReason told the traveler the
      # server had restarted, which had not happened. `interests: "food"`
      # and `must_see: null` threw INSIDE it and landed on "Unexpected
      # error generating itinerary." after work that may already have been
      # paid for. A sixth was worse than a crash: `start_date: "soon"`
      # generated a complete, paid trip with nonsense on every day, because
      # briefSpanDays returns null for an unparseable pair so the day cap
      # never fired either.
      #
      # And the final write. The comment above the progress writes already
      # said "the final writeJob is the one that has to land" and nothing
      # made it: a Redis set failure threw after the catch, escaped
      # processJob into runConsumer's catch-and-continue, and dropped a
      # generated and fully paid itinerary with the record left at
      # "running". publishJob retries it and gives up loudly.
      #
      # Reverting both makes 8 of 71 red - measured.
      - run: npm run test:brief-shape
      # Does venue verification actually run ALONGSIDE the day calls.
      # The timing audit's floor is why: on the 102.4s run an instant
      # phase 1 still lands at 33.6s, because the stages after it do not
      # care how fast it was - and a Places lookup for day 1's restaurant
      # does not need day 3 to exist. Safe to move because checkVenues is
      # per-item with no cross-day logic and its `only` option already
      # existed for partial passes.
      #
      # Two assertions carry it, and the SECOND matters more. The overlap
      # itself: a lookup must start before the last day call finishes -
      # reverting makes 6 of 15 red, with "day 3 ended at +1808ms, day 1
      # lookups began at +1810ms" as the detail. And no venue may be
      # looked up twice: the whole-itinerary pass still runs after the
      # per-day ones (a refinement and the single-call fallback produce no
      # per-day callbacks), filtered by unverifiedVenueItems - drop that
      # filter and the same trip makes 24 Places lookups instead of 12,
      # which is ADDING a call per item while claiming to save time.
      # Spending money to look faster is worse than the original problem,
      # so it is asserted directly rather than inferred from the clock.
      #
      # Day durations are staggered on purpose: with every stub taking the
      # same time, "verification overlapped the days" and "verification
      # started the millisecond the days ended" are indistinguishable.
      # Both the model and globalThis.fetch are stubbed - no key, no
      # network, no cost on either side.
      - run: npm run test:verify-overlap
      # Opening-hours arithmetic - "open on the day we send them" is a
      # claim the itinerary makes in writing.
      - run: npm run test:hours
      # The latency counters' bucketing. The boundary that decides whether
      # a run "met the 30s target" is a promise, and getting it wrong
      # produces a panel that is confidently, specifically wrong.
      - run: npm run test:timing
      # The generation-path defects a full review of index.ts, twoPhase.ts
      # and checks.ts turned up: a budget correction that always computed
      # zero, a phantom hotel night on a night spent in transit, an arrival
      # night labelled as a continuation, and two phase-1 gates loose enough
      # to let a half-formed plan through. Every one of them passed the six
      # suites that existed before it.
      - run: npm run test:generation
      # It also covers budget_feasibility, which isUsableFrame checked with
      # `!f.budget_feasibility` - truthy, not a shape - on the one field
      # carrying the trip's money claims. Four values passed and each cost
      # something. `"feasible"`: applyVerifiedAccommodation raised "Cannot
      # create property 'min_realistic_total_eur' on string", because
      # assigning to a primitive is a TypeError in strict mode and every ES
      # module is - caught far away by generateItinerary's broad catch,
      # which abandons the parallel path and regenerates the whole trip in
      # one serial call. An array absorbed the write silently. And
      # `min_realistic_total_eur: "1200"` concatenated: `"1200" + 80` is
      # "120080", Math.round kept it, and the page offered a MINIMUM
      # ESTIMATE OF EUR 120,080 for four days in Rome - a finite number that
      # looks legitimate, which is why the itinerary-level recovery cannot
      # catch it, since the damage happens before assembly. The frame half
      # also had no normalize hook while the plan half did, so every defect
      # in it went straight to the validator's wall; normalizeFrame recovers
      # the one field with a single obvious reading and refuses to guess a
      # verdict for `feasible`. Reverting makes 16 of 96 red, printing
      # 120080.
      #
      # (test:generation also covers the rate-limit backoff: `Retry-After: 0`
      # and a negative both pass Number.isFinite, and Math.min(-5000, 15000)
      # is -5000, so setTimeout fired at once and the backoff became four
      # requests with no wait between them - aimed at a provider that had
      # just said it was rate-limiting us. Reverting makes 4 red.)
      # The shape gate on the single-call fallback and every refinement.
      # Those two paths did `JSON.parse(text) as Itinerary` and returned it -
      # a type assertion, not a check - so a response that parsed but was
      # missing `days`, or carried a day without an `items` array, reached
      # normalizeLodgingPrices, threw inside processJob, and discarded a
      # FULLY GENERATED, fully paid itinerary as "Unexpected error". Nothing
      # detected it, so the retry wrapping both call sites never fired
      # either. Verified end to end: without this gate the same response
      # loses the generation, with it the retry succeeds.
      #
      # It now also covers the item STRINGS, which is the same class one
      # step further and the one that discards a paid trip. `time`, `title`,
      # `location` and `reasoning` are declared required strings and arrive
      # from the same assertion. Measured, with `"time": 1300` - a model
      # asked for a clock time writing a number:
      #   mealSlotOf    THREW: time.toLowerCase is not a function
      #   assessQuality THREW: time.toLowerCase is not a function
      # The gate runs LAST, inside processJob's try and outside every retry,
      # so its throw marks a fully generated, fully paid itinerary
      # "Unexpected error generating itinerary". Same for venue_name
      # (.toLowerCase in four places including the gate) and location
      # (perNightRateFor, which the gate and normalizeLodgingPrices both
      # call). Absence is deliberately left alone - every reader guards
      # falsiness, so only a wrong TYPE throws, and coercing absence would
      # cost the no-op property the repairs depend on. Reverting makes 10 of
      # 89 red.
      - run: npm run test:shape
      # What counts as a price. types.ts declares `cost_estimate_eur: number`
      # and 30-odd readers believe it, but the value arrives through
      # `JSON.parse(text) as ItineraryDay` - an assertion, not a check - and
      # nothing between there and the trip total ever tested its type.
      # Measured: one item priced "20" instead of 20 makes `10 + "20" + 30`
      # the STRING "102030", so budget_matches_items reported "the items add
      # up to EUR 102030 against a EUR 2000 budget" and stamped a defect on a
      # sound trip, while the item's own line rendered a perfect "€20". A
      # range ("15-20") made the total NaN instead. The same suite covers the
      # judgement the page had been getting wrong in the other direction:
      # zero on a meal, a bed or a flight is a price we do not have, not
      # "Free".
      - run: npm run test:money
      # Finding the JSON in a model reply, which every phase-1 half, every
      # day call and every repair goes through. extractJson required the
      # JSON to start at character zero, or a fence to. Measured: an
      # UPPERCASE fence, a preamble before a fence, a preamble with no
      # fence, and trailing prose all failed to parse - and "Here is your
      # itinerary:" is about the most ordinary thing a model writes.
      #
      # The cost is not cosmetic. A parse failure is a ModelOutputError,
      # which withOneRetryOf retries on the stated grounds that "malformed
      # JSON is non-deterministic, one retry usually succeeds" - and a
      # preamble is a HABIT, not noise, so the retry re-sends a request that
      # fails identically, the two-phase path is abandoned, and the whole
      # itinerary is regenerated in one serial call. Three paid calls and
      # the slow path for a sentence in front of the answer, against a 30s
      # budget.
      #
      # Candidates tried until one PARSES, rather than one cleverer
      # extraction - guessing which slice is the payload is what the old
      # version did. Brace counting respects strings and escapes, so a venue
      # named `Da Enzo}` does not truncate the object, and nothing invents a
      # closing brace: a truncated reply is a real failure with a real fix
      # (the cap, which generatePhase1Half escalates). Reverting makes 19 of
      # 43 red.
      - run: npm run test:model-json
      # Whether the day leaves time to get between its stops - the check
      # the acceptance gate did not have, and the most common way an AI day
      # plan fails. Not a wrong fact: 09:00 at the Colosseum and 09:30 at
      # the Villa d'Este in Tivoli is a real pair of places, a real pair of
      # times, and 34 km of Lazio in between. Every other check passes it -
      # the prices are sourced, both venues exist, both are open, no gap, no
      # duplicate - and the day is simply not possible. The coordinates were
      # already on the items (checkVenues writes them) and DayMap was
      # already drawing the day's shape from them, so the information was on
      # the page and only a person could read it.
      #
      # A straight-line estimate with a detour factor, not routing: real
      # routing is an API call per consecutive pair on a critical path
      # already fighting a 30s budget, and street accuracy is not what
      # catching an impossible day needs.
      #
      # This suite is also where the thresholds got calibrated, and it
      # earned its keep on the first run: the headline example was written
      # as the Vatican Museums at 09:00 and the Colosseum at 10:00, the case
      # went red, and the numbers were right - 4.8 km is about 24 minutes
      # across Rome and an hour is plenty. Both readings are kept, because
      # the difference between the one that sounds impossible and the one
      # that is IS the check. Reverting the detour factor, the cos(latitude)
      # correction and the transit overhead makes 9 of 74 red.
      - run: npm run test:travel
      # Does the timing line add up. Latency here has been diagnosed by
      # reasoning five times and been wrong three of them, and every round
      # of instrumentation answered "how long did stage X take" while never
      # answering the question that comes first: is the measured time the
      # whole time. If the stages sum to 85 of 102 seconds then seventeen
      # seconds are happening somewhere nobody instrumented, and the work
      # being done on the plan call is work on the wrong half of the job.
      #
      # The subtraction is trivial; what this suite holds is which stages
      # are SERIAL and which run CONCURRENTLY, because getting that wrong
      # makes the audit worse than no audit. lodgingPrefetchMs runs
      # alongside generation deliberately - add it and a job with a slow
      # lookup reports a NEGATIVE remainder, which reads as "we found
      # time". Doing exactly that makes 7 of 49 red.
      #
      # It also computes the floor: what a run would total with an INSTANT
      # phase 1. On the 102.4s run that is 33.6s - already past the 30s
      # target - so the day calls and the verify/repair passes set a floor
      # no amount of work on the plan call gets under. That is the
      # conclusion the numbers only implied, and it is arithmetic now
      # rather than an argument. Fixtures are the real measured runs.
      - run: npm run test:timing-audit
      # Which models are sent output_config.effort. DAY_MODEL exists to
      # invite a swap to a faster day model, and the obvious candidate
      # (Haiku 4.5) is one of the two models that REJECT that field - so the
      # dial as shipped pointed at a configuration where every day call
      # 400s and the whole generation fails. The predicate is an allowlist
      # because the two mistakes differ in size: omitting effort costs a
      # little speed, sending it where it is refused costs the generation.
      - run: npm run test:model-caps
      # The bounded wait that took the accommodation lookup off the
      # critical path. On the first measured 58.5s generation that lookup
      # WAS the critical path - 16.5s, then a retry that also came back
      # empty, 29.2s total - while a fully built fallback (the trip frame's
      # own estimate) sat ready. Two cases here are the difference between a
      # slow trip and no trip: a REJECTED frame must never win the race (or
      # one recoverable failure abandons the lookup too and the job has
      # neither figure), and an abandoned lookup's later rejection must stay
      # observed, since Node exits the process on an unhandled rejection and
      # this worker runs four jobs at once.
      - run: npm run test:race-fallback
      # Bounded parallelism, shared by the day calls and the Places
      # lookups. Promise.all rejects on the first failure but does not stop
      # the other workers, so they kept pulling the next index and issuing
      # the next paid call for output the caller had already decided to
      # discard - a whole extra wave of day calls on a trip longer than
      # MAX_PARALLEL_DAYS, up to fourteen at the 30-day cap. Reverting the
      # early exit makes this suite report all twenty items started.
      - run: npm run test:concurrency
      # The Places pass - the code that DELETES venues - which had no
      # direct test at all. Three silent venue-deletion bugs have lived in
      # that file, and the live rehearsal cannot reach it (it runs without a
      # Places key, so checkVenues returns immediately). fetch is stubbed,
      # so no key and no network. The load-bearing case: removing the
      # "we could not ask" / "it does not exist" distinction makes this
      # suite report every item deleted - a Places outage emptying whole
      # trips.
      - run: npm run test:venues
      # (test:venues also covers ISOLATION. runWithLimit fails fast by
      # design - one throw sets `failed` and rethrows, and Promise.all over
      # the workers rejects - which is right for the day calls it was
      # written for and wrong for verification, a stage this file's own
      # comments say degrades per item: "leave the item untouched rather
      # than deleting it", "those items ship unverified rather than being
      # dropped". The whole-itinerary pass and the post-repair pass are both
      # awaited inside processJob's try with no catch of their own - only
      # the per-day passes carry one - so one unexpected throw on one venue
      # abandoned verification for every remaining item AND marked a fully
      # generated, fully paid itinerary "Unexpected error". Reverting makes
      # 3 red, one of them "no item is lost to the failure - 0".)
      # The accommodation cache - the highest-leverage write in the
      # pipeline. What it stores is handed to the next ~20 hours of
      # generations for that city as fact, with "do not perform a new
      # accommodation search". It had no test, and two fixes lived here
      # unguarded: no price check at all (a bed shipping at 0 was cached, so
      # the trip's largest line was priced at zero and the search that would
      # have corrected it was suppressed), and a write that REPLACED rather
      # than merged, turning a named property into an unnamed one. Reverting
      # either makes this suite red.
      #
      # It now also covers what comes back OUT of Redis, which was
      # `JSON.parse(raw) as CachedLodgingFact` - a shape asserted over a
      # stored value that both consumers then trusted. Measured against the
      # real functions, five of eight malformed values THREW ("null", "{}",
      # "42", "[]", a bare string, a non-array sourceUrls), and that throw
      # happens in loadCachedLodgingFacts, awaited at the TOP of every
      # non-refinement generation - so the job fails, and fails again for
      # every traveller going to that city until the ~20h TTL runs out. The
      # sixth is worse for being silent: a stored zero formats cleanly as
      # "verified via live search at approx EUR0/night ... do not perform a
      # new accommodation search", which is the defect the write guard
      # above exists for, still reachable because entries written before
      # that guard are still live. Price and age are dropped rather than
      # repaired, which puts the city back in `missing` and buys a real
      # search; URLs and names are sanitized, since an unnamed entry is a
      # supported state. Reverting the read guard makes 15 of 64 red.
      - run: npm run test:accommodation-cache
      # Per-night accommodation pricing - the largest line in the
      # itinerary. normalizeLodgingPrices reaches perNightRateFor, where
      # `"x".includes("")` being TRUE meant an accommodation entry with city
      # "" was the first match for EVERY lodging item: every night in every
      # city rewritten to that entry's rate, with the
      # lodging_price_per_night check afterwards agreeing with the corrupted
      # figure. A MISSING city threw instead, discarding a fully generated
      # itinerary as "Unexpected error". Reverting the guard makes this
      # suite report [999,999] across a two-city trip plus two throws.
      - run: npm run test:accommodation-pricing
      # How a paid call is bounded and how it reports failing. The
      # accommodation lookup ran under the client-wide 120-second ceiling -
      # a ceiling sized for the calls the itinerary cannot be produced
      # without - and its retry carried no allowance at all, so a slow
      # attempt plus a slow retry simply added up: 30.9 seconds spent on one
      # real generation for no nightly price. The failure was logged as a
      # STACK, which names the line the call was made from (never the
      # question) and cannot tell a 429 from a refused request from a
      # timeout - three different fixes, and choosing between them cost
      # another paid generation. Two cases here are the expensive ones: a
      # retry must get only the time that is LEFT, and a request the API
      # refuses outright (the worker can be pointed at a model that rejects
      # output_config.effort) must not be retried into a second guaranteed
      # 400. Errors are built by the SDK's own factory, because the SDK
      # leaves `name` at "Error" on every subclass and a hand-faked error
      # made this suite pass against code reading the wrong field.
      # What a call is RECORDED as costing, which is what the daily spend cap
      # is enforced against. estimateCostUsd priced input, output and cache
      # read/write tokens and stopped there - but server-side tools are not
      # billed in tokens at all: every web_search request is a separate
      # per-request charge on usage.server_tool_use, and nothing in the
      # product read that field. Three places declare the search tool (the
      # accommodation lookup, which makes up to eight searches for a
      # single-city trip; the single-call generation path; and Ask a Local,
      # which fires on every question any visitor asks). From the one run
      # with a known total, roughly a quarter of its real cost was invisible
      # to the counter - so the counter reaches a $25 DAILY_BUDGET_USD when
      # real spend is nearer $32, and the cap whose entire job is to stop
      # that never trips. Reverting the pricing makes 11 cases here red.
      # loadFacts, which turns a destination name into a filesystem read.
      # The filename was built straight from a caller-supplied city name and
      # `path.join` NORMALISES "..", so a destination of "../../package"
      # resolved to the repository's own package.json, outside facts/ -
      # measured, and reachable because /api/city-facts passes its
      # `destinations` query parameter straight in on an unauthenticated
      # GET. The payoff was narrow for three accidental reasons (".json" is
      # appended, it must parse, only a `facts` array is returned); none of
      # them was put there to stop a traversal. All 24 real files match
      # ^[a-z0-9_]+$, so the slug check cannot refuse a name that could ever
      # have resolved to curated data - every case here runs against the
      # REAL facts directory, so the cities that must still work are proven
      # to. Rejected rather than sanitised, because stripping the characters
      # would turn "../rome" into Rome and serve one city's facts under
      # another city's name.
      - run: npm run test:facts
      - run: npm run test:cost
      # The live flight fare - the second-largest line in most itineraries,
      # the one place this pipeline replaces the model's number with a real
      # quoted one, and it had no test at all. Amadeus quotes a ROUND-TRIP
      # fare; applyFlightPricing wrote that whole figure onto the arrival
      # item and stopped, while prompt.ts asks the model for an arrival leg
      # AND a last-day departure leg each with its own estimate - so the
      # return was charged twice. A EUR 240 round trip shipped as 240 + the
      # model's own 150. It fired only when the live fare SUCCEEDED, so the
      # "checked live, grounded" path produced a worse total than the guess
      # it replaced, and budget_matches_items adds the same inflated sum up
      # before deciding whether the trip fits the stated budget. Split
      # rather than zeroed because a flight priced 0 is a prices_present
      # defect by design. Reverting makes 12 cases here red, the first
      # reporting [240,150].
      - run: npm run test:flight-pricing
      - run: npm run test:call-budget
      # Which calls are allowed NOT to stream, and it is not a preference.
      # messages.create refuses a non-streaming request outright when
      # max_tokens implies a response that could take over ten minutes -
      # ~21,300 tokens for this model, against SKELETON_MAX_TOKENS of
      # 24,000. The only reason phase 1 was not failing on every single
      # request is that the SDK skips that guard when the client carries an
      # explicit timeout, and this worker sets one. What the suppressed
      # warning was hiding: on a non-streaming request the SDK's timer
      # covers the WHOLE generation, so CALL_TIMEOUT_MS was a 120-second cap
      # on total generation time against a plan call measured at 68.8
      # seconds - and a timeout is the one failure neither retry wrapper
      # handles, so it dropped straight to the single-call fallback, which
      # was non-streaming too and had to write an entire itinerary. All four
      # claims were verified against the real SDK over a local SSE server,
      # not reasoned about.
      # The day plan - the one call every other call waits for. Measured at
      # 68.8s of a 102.4s generation, 67% of it, while its concurrent
      # sibling (the trip frame) cost the traveler nothing because the day
      # calls run alongside it. So anything that makes the PLAN happen twice
      # doubles the visible length of the product, and two things could.
      # isUsablePlan is a wall: one day missing one field discarded the
      # whole plan and regenerated it, including for fields that are
      # arithmetic on the brief - and including a flat contradiction, since
      # the prompt tells the model a generic activity "needs no anchor" and
      # the validator then required the key. And a truncated half was
      # re-sent with the IDENTICAL cap: a guaranteed second truncation,
      # after which the two-phase path was abandoned for one serial call -
      # three paid calls and the two-minute path. Reverting the repair makes
      # 20 cases here red; reverting the escalation makes 4.
      - run: npm run test:plan-repair
      # Reasoning effort, which is now set per stage rather than globally -
      # because the measured calls are not alike: the plan took 68.8s to
      # produce ~400 tokens of JSON while the frame took 31.6s to produce
      # ~700, and only one of them has every day call waiting on it. The
      # plan and the day calls therefore cap at "medium". Two cases here
      # pull in opposite directions and both are load-bearing: raising
      # MODEL_EFFORT must NOT quietly un-cap the stages on the critical path
      # (one dashboard edit would otherwise break the 30-second promise with
      # no warning), and lowering it must still mean low EVERYWHERE, which
      # is what hard-coding the level instead of deriving it would get
      # wrong. Reverting the cap makes 5 cases red; hard-coding it makes a
      # different one red. Also covers readEffort, where a typo in a hosting
      # dashboard field is a 400 on every call that carries it - enough to
      # fail all of phase 2 and fall back to the two-minute serial path.
      - run: npm run test:effort

  frontend:
    name: frontend - typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # The linter - same config shape and same rationale as the worker's
      # step above, plus Next's react-hooks pair. exhaustive-deps found a
      # real one on the first run: CompareView's poll handler read
      # `t.genericError` from a closure while its effect keyed on jobId
      # alone, so switching language mid-poll rendered the error in the
      # PREVIOUS language. Fixed with a ref rather than by adding `t` to
      # the deps, which would have re-polled the job on every toggle. It
      # ships as a warning, and `eslint .` exits 0 on warnings, so it is
      # escalated to an error here - a rule that does not gate is a rule
      # whose next finding scrolls past in green CI.
      #
      # Cost of the type-aware rules, measured rather than assumed: 14.6s
      # over app/, components/ and lib/. That is the slow step of the two
      # linters and still a rounding error next to `npm run build`.
      - run: npm run lint
      # Every text color in the palette against the backgrounds it's
      # actually painted on. --ink-dim - the color of nearly every label,
      # date and helper line in the product - shipped for months at
      # 3.28:1, under the 4.5:1 WCAG AA needs for body text, and the only
      # thing that would have caught it was someone noticing. Pure
      # arithmetic over the stylesheet: no browser, no network, runs in
      # milliseconds.
      - run: npm run check:contrast
      # Can a traveler type on a phone without the page zooming in?
      #
      # iOS Safari zooms the whole page when a focused text field is under
      # 16px and does not zoom back out, so the layout ends up wider than
      # the viewport and you pan sideways to finish the form. Reported from
      # a real phone: "when trying to type something it zooms in and messes
      # up the sizing of the page, looks unprofessional, none of the big
      # apps like booking, wizz and rest do that." They don't, because 16px
      # is the only thing that switches it off.
      #
      # This guard is here for the fix that looks easier and is wrong.
      # `maximum-scale=1` also stops the zoom - by taking pinch-zoom away
      # from everyone, including the people who need it to read at all
      # (WCAG 1.4.4) - and newer Safari ignores it, so it trades an
      # accessibility failure for nothing. It is one line and it is the top
      # answer everywhere. So the guard checks the viewport stays zoomable,
      # that the 16px floor still covers inputs AND textareas inside a
      # touch media query with !important (a sweep found 29 fields between
      # 11px and 15px across 13 files, mostly inline styles a plain rule
      # cannot reach), and that the shared inputStyle is 16 at its source
      # so the form is not one size on a laptop and another on a phone.
      #
      # All three reverts were measured red. It does not re-derive the list
      # of small fields: the floor covers them by construction, and a
      # scanner would fail on every new 11px label in an admin panel while
      # proving nothing.
      - run: npm run check:touch-zoom
      # No em dashes anywhere in the repo. It is the single most
      # recognisable sign that a line of text was written by a model, and
      # this product asks travelers to read its output as advice from a
      # person. The prompts ask the model not to write one and the worker
      # strips any that survive; this covers the copy we write ourselves.
      - run: npm run check:dashes
      # The trip cover's list of which cities have a photo is a hand-copy
      # of a directory listing, because the trip page is client-rendered
      # and cannot read the filesystem. This is what stops it drifting.
      - run: npm run check:covers
      # The worker writes the stats counters over ioredis and the app reads
      # them over the Upstash REST client, so both sides spell out the key
      # names by hand. Drift there is silent: a mismatched field reads as
      # zero, which looks exactly like "no traffic yet". Also covers the
      # heartbeat contract, where a one-sided rename would make
      # /api/health return 503 forever.
      - run: npm run check:stats-keys
      # The four files that exist TWICE - jobs.ts, types.ts, costBudget.ts
      # and engine/prompt.ts, once under worker/src/ and once under
      # frontend/lib/. Each says in its own header that the copies are "kept
      # byte-identical" and nothing enforced it. The worker writes over
      # ioredis and the app reads over the Upstash REST client, so neither
      # can import the other's module - copying is the design - but a copy
      # kept in step by a comment is a copy that drifts, and every drift
      # here is silent: a job field added on one side reads as undefined on
      # the other (which renders as "no data", indistinguishable from a
      # stage that did not run), and two different pricing functions mean the
      # gate that blocks generation and the counter that records spend
      # disagree about money. The one legitimate divergence is marked in the
      # file with FRONTEND-ONLY sentinels and stripped before comparing, so
      # a deliberate frontend-only export is allowed and nothing else is.
      # The curated facts base exists in THREE places - facts/ at the root
      # (source of truth), frontend/facts/ and worker/facts/, both copied in
      # because each deploy needs to be self-contained. Nothing compared
      # them, and they HAD drifted: the worker held 18 files against 24,
      # missing bangkok, dubai, mexico_city, new_york, singapore and tokyo -
      # every non-European destination. The worker is the process that
      # GENERATES the itinerary, so on those six cities loadFacts returned
      # nothing and the model worked from memory alone, while the frontend's
      # own copy still fed the loading screen trivia for them: the product
      # looked grounded on exactly the trips that were not. Invisible from
      # either side - generation succeeds, the page renders, and the only
      # trace is that no item on those trips can reach the fact_grounded
      # confidence tier. Contents are compared too, since a copy with the
      # right name and stale text is the same failure better disguised.
      # The two translation dictionaries, for what the type system cannot
      # see. Key parity IS already covered - Dictionary is a strict
      # interface and both dictionaries are typed to it, so a missing
      # Bulgarian key is a compile error - and this does not duplicate that.
      # Three things slip past it, and every one renders as visible nonsense
      # rather than as an error: a Bulgarian string that drops or misspells
      # a {placeholder} silently loses the substitution, so the number or
      # city name simply never appears; an array one entry short drops a
      # feature from the pricing page for Bulgarian visitors only; and a
      # {token} nothing replaces renders literally, so the visitor reads
      # "Plan: {plan}". That last rule found two such strings, both of
      # which turned out to be entirely unreferenced and were deleted. All
      # three shapes are verified caught by breaking them.
      - run: npm run check:i18n
      - run: npm run check:facts
      - run: npm run check:mirrors
      # The print stylesheet, and the markup it acts on. There was no
      # print stylesheet at all - not a reduced one, none - so the
      # product's main artifact printed as the screen: a two-row nav bar,
      # a currency switcher, a language toggle, an empty pushback input
      # with its submit button, the Ask a Local thread, per-item
      # "helpful / wrong" links, a footer of legal links, in colour, with
      # days cut in half wherever the page ended.
      #
      # These rules are CSS matching class names in TSX, which is the most
      # breakable coupling there is: rename a class and nothing fails, the
      # page just quietly prints wrong again, and nobody prints often
      # enough to notice. So this checks both directions and each rule
      # that carries weight. Reverting any one of six - the .print-only
      # base rule, hiding <button>, break-inside: avoid, the :root palette
      # override, hiding <img>, or renaming a hook - makes it red.
      #
      # The real verification is a browser, and was done in one: render
      # ItineraryResult to markup, load it with the built CSS, emulate
      # print media in Chromium and read the computed styles. That is what
      # found the .print-only defect (the colophon rendered on screen too)
      # and it is how to re-check a change here. It is not in CI because
      # every other check in this file runs in seconds with no browser and
      # no key.
      - run: npm run check:print
      # That every guard above actually runs here. Written after three of
      # them - test:hours, test:timing and check:stats-keys - sat in
      # package.json catching nothing because nobody added the step. A
      # dormant guard is worse than a missing one.
      - run: npm run check:ci
      # The link boundary in an Ask a Local answer. This is where model
      # output becomes an href, and the module's claim that "javascript:"
      # and "data:" cannot reach a rendered anchor was enforced by nothing
      # until this suite - a typecheck reads a regex without caring what it
      # matches.
      - run: npm run test:linkify
      # The reader half of the latency counters. The worker's suite covers
      # which bucket a total lands in; this covers the number the panel
      # actually prints against the 30-second promise, plus the per-stage
      # divisor that makes re-verify's average honest.
      - run: npm run test:stats
      # The door every paid generation comes through. parseTripBrief checked
      # that start_date and end_date were non-empty strings and nothing
      # else - not that they were dates, not their order, and not how far
      # apart they were. Since the worker makes one model call per planned
      # day, a single request carrying 2026-01-01 to 2026-12-31 commissioned
      # 365 of them, and the daily spend cap cannot catch it: that check is
      # a read taken BEFORE the job runs.
      - run: npm run test:validation
      # The two bits of formatting on the finished trip page. One rendered
      # every Bulgarian budget explanation as a single run-on bullet
      # (splitting on [A-Z], which no Cyrillic capital is) and threw during
      # render on a field nothing guarantees, blanking a paid-for
      # itinerary. The other picked the opening-hours line by index
      # arithmetic on a Google array ordering that isn't guaranteed, so the
      # page could print the wrong day's hours under a green "open on this
      # day" badge.
      # Does the trip PAGE render. Every other suite here asserts about a
      # function; this one renders the component with react-dom/server,
      # because the failure this product has had twice is a render throw on
      # a field nothing guarantees, and the blast radius is a blank page on
      # an itinerary somebody paid for. currency.ts's own header records
      # one: a cached rates body with no `rates` key threw inside formatMoney
      # "for every visitor, for twelve hours, on itineraries people had paid
      # for."
      #
      # The itinerary it renders is deliberately UNNORMALIZED - twelve items
      # carrying every mistyped shape the worker now coerces at the shape
      # gate - because no worker change can reach a record already sitting in
      # Redis. Measured with today's render fixes reverted: the page did NOT
      # throw, it produced 27,939 characters containing "EUR NaN", and "Free"
      # appeared TWICE, the second being a dinner priced zero. That is the
      # shape this suite is for: not a crash, a confident wrong number on a
      # page about money.
      # Also covers the WAIT, the longest visual moment in the product.
      # TripBuilding replaced LoadingScreen so the wait could show the real
      # outline as phase 1 and each day land, and in doing so silently
      # dropped the city facts - which only ever existed in LoadingScreen, a
      # component nothing renders on the trip page any more. The first
      # twenty seconds of every generation (20 of the 52 on the measured
      # Rome run) were a title and one status line. The rotation is shared
      # now. renderToStaticMarkup does not run effects and the facts arrive
      # in one, so what is asserted is the thing that actually regressed:
      # whether the component the page renders is wired to the rotation.
      - run: npm run test:render-trip
      # Does the flight section group by LEG - arrival down one side,
      # departure down the other?
      #
      # The six flight fields were six siblings of the form's own
      # two-column grid, so CSS laid them out in source order and the
      # grouping was an accident of how many there were: arrival airport
      # ended up beside the DEPARTURE date, and reading down the left-hand
      # column went arrival, arrival, departure.
      #
      # This needs a RENDER and not an eyeball because the source order is
      # identical before and after: all six labels appear in the same
      # sequence either way, so any assertion about where a label sits in
      # the markup passes on the broken layout too. Only the nesting
      # changed, so the suite walks the tree - both ways round, since a
      # column holding the right fields AND one of the other leg's is
      # exactly the old behaviour. It also asserts the one CSS rule the
      # columns depend on, which lives in a different file and is
      # referenced only by a string. Reverting the two per-leg wrappers
      # makes 13 of 32 red - measured.
      #
      # It also covers two defects reported off a live run. The origin field
      # was a bare text input sitting under a chip-and-suggestions combobox,
      # so one screen asked "name a city" twice and answered it two ways -
      # it is the same control now, and this counts the comboboxes. And
      # picking a time left its list open: not a TimePicker bug (its own
      # `choose` always closed it) but the <label> that Field wraps every
      # field in, forwarding the click straight back to the trigger button,
      # which reopened it. The date pickers carried hand-copied <div>s
      # working around exactly that; the time pickers did not. Field takes a
      # `popover` prop now, and the suite asserts on ELEMENT NAMES, because
      # the bug is invisible in the rendered text and lives entirely in
      # which tag wraps what. Reverting the prop makes 5 of 43 red.
      - run: npm run test:render-trip-form
      - run: npm run test:result-format
      # Money on the page, in the currency the traveller picked - and the
      # second defect here blanked the trip page. formatMoney read
      # `rates?.rates[currency]`: the optional chain guarded the object being
      # null and NOT the map inside it being absent, so `undefined[currency]`
      # threw a TypeError. Reachable through /api/rates, which read the
      # upstream response with a bare `as { rates: ... }` - a type assertion
      # over a network payload, the same non-check test:shape exists to stop
      # on the worker side - and cached whatever came back for TWELVE HOURS.
      # A 200 with no `rates` key cached `rates: undefined`, JSON.stringify
      # dropped the field, and every trip page render threw: every visitor,
      # twelve hours, on itineraries people paid for. The quieter case is a
      # rate that is present but unusable - a string, a zero, a negative, a
      # NaN - which printed $0, $-108 and $NaN against a real currency
      # symbol. Reverting the guards makes 8 cases red; reverting the
      # sanitizer makes 9.
      # The recent-trips bookmark list, which renders inside the homepage
      # hero. getRecentTrips did `Array.isArray(parsed) ? parsed : []` - it
      # checked the container and nothing in it - while RecentTrips.tsx
      # renders `trip.destinations.join(" · ")`. One stored entry missing
      # that field throws a TypeError DURING RENDER, so the visitor gets a
      # blank hero with no way to know why, and it returns on every load
      # because the bad entry is read again each time. Same shape as the
      # exchange-rate bug: data from a store that outlives deploys,
      # rendered without being checked - and reachable without anyone
      # editing anything, since RecentTrip is versioned by nothing, so the
      # day a field is renamed every returning visitor's entries are the
      # old shape. A bad row is dropped and the good ones beside it kept,
      # because losing every real bookmark over one corrupt entry would be
      # its own bug. Reverting makes 18 cases red.
      - run: npm run test:recent-trips
      # The site's absolute base URL. siteUrl.ts's own header described it
      # as being for metadataBase, sitemap.ts and robots.ts; grep says it
      # also builds the MAGIC-LINK SIGN-IN URL that gets emailed, both
      # auth-verify redirects, all three api/visited/share links, and
      # Stripe's checkout and billing-portal return URLs. So a wrong value
      # is a sign-in email nobody can use, with a token that expires in
      # fifteen minutes, and a customer who finishes paying and lands
      # nowhere. And it failed silently: with neither Vercel variable set
      # it returned http://localhost:3000 with nothing overriding it and
      # nothing logged. On Vercel the variables are injected so it worked,
      # but nothing in the code made that a requirement, and there was no
      # way to pin the real custom domain - the one that has to match the
      # host whose cookie the session is set on. Now an explicit SITE_URL
      # wins, non-absolute and non-http values are refused instead of
      # being concatenated with a path, and the localhost fallback says so
      # once per process in production. Reverting makes 9 of 18 red.
      - run: npm run test:site-url
      # The session cookie, which is the whole of authentication - there is
      # no server-side session store, so the cookie IS the credential:
      # base64url({email, exp}) signed with HMAC-SHA256 over SESSION_SECRET.
      # getSecret() checked `if (!secret)` and nothing else, so ANY
      # non-empty value signed sessions, "x" included. The payload half is
      # public - it is the visitor's own cookie - so one cookie lets someone
      # test candidate secrets offline as fast as their hardware computes
      # HMAC, with no rate limit and nothing logged; and what a guessed
      # secret yields is not one account but the power to mint a cookie for
      # ANY email, including a PRO_OVERRIDE_EMAILS address that resolvePlan
      # grants paid access to with no Stripe record. /admin/health could
      # not have said so, because it reports presence and a one-character
      # secret is present - on the one page built to name quiet
      # misconfiguration. Now there is a 32-character floor (what the README
      # already prescribes), sign-in REFUSES rather than issuing a cookie it
      # cannot stand behind, and the health page says TOO WEAK with the fix
      # - still without reading a character of the secret, or even
      # reporting its length. Reverting both halves makes 24 of 90 red.
      - run: npm run test:session
      # The OTHER shared secret, which was the one credential surface in this
      # app with nothing limiting the guessing. /admin/* compared a password,
      # answered 401 and recorded nothing, so it could be tried as fast as
      # the network allows, forever, with nothing in any log - while every
      # other credential-ish surface here is rate limited. Behind it:
      # /admin/feedback lists travellers' own feedback text and the itinerary
      # items they rated, and the same value is the test-mode key
      # /api/generate accepts to SKIP the daily spend cap and every rate
      # limit, so a guessed password spends the owner's Anthropic money
      # without bound. Also: the compare was `===` while /api/generate uses
      # timingSafeEqual on the same secret, and /admin/health did not list
      # ADMIN_PASSWORD at all, so a two-character one had nowhere to appear.
      #
      # The decoding assertions matter as much as the security ones - this
      # sits in front of a tool the owner already has a working password for,
      # and a "safer" parse that rejects it locks them out of their own site.
      - run: npm run test:admin-auth
      # And the policy, through the real middleware, because the two
      # decisions most easily got subtly wrong are not in the parser. A
      # request with NO credential must not spend a limiter attempt - the
      # browser's first request never carries one, so counting those lets
      # anyone lock the owner out by opening the URL ten times. And the
      # owner's correct password must cost no Redis round-trip, which is what
      # makes it safe for the limiter to fail CLOSED. Both are asserted from
      # outside with no Redis configured at all: a counted attempt would come
      # back 429, so a 401 proves the limiter was never consulted. Reverting
      # the first makes 9 of 32 red, the second 3 of 31.
      - run: npm run test:admin-gate
      # The counter behind that gate, which had to be written from scratch
      # because lib/ratelimit.ts CANNOT RUN where it was needed. Middleware
      # is Edge; that module reaches @upstash/redis's nodejs.mjs, and the
      # build says "A Node.js API is used (process.version) which is not
      # supported in the Edge Runtime" - a WARNING, so the first version
      # would have deployed and then either 500'd every /admin request or
      # worked until it didn't. It also cost 25 kB of middleware bundle for
      # one counter (34.2 kB -> 59.9 kB, back to 35.0 kB once replaced).
      #
      # Upstash REST over plain fetch instead, with the window number inside
      # the key - which is what makes re-setting the TTL on every increment
      # safe, since the next window is a different key starting from zero.
      # Every failure path refuses: unconfigured, non-200, unparseable,
      # unreachable, timed out, or a count that is not a number. It is the
      # only limiter here that fails CLOSED, because the others bound cost
      # and this one bounds guesses at a credential.
      - run: npm run test:edge-rate-limit
      # Which airport, for the cities where that changes the itinerary.
      # Rome Fiumicino is ~32 km west with a 32-minute train to Termini;
      # Ciampino is ~15 km southeast with no rail link at all - so the
      # transfer, the first afternoon and the last morning all depend on
      # which one it is, and "be at the airport by nine" means a different
      # departure from each. Same for Paris (Beauvais, 85 km out, sold as
      # Paris), Milan (Bergamo likewise), London's five and Tokyo's Narita
      # against Haneda. Two things this holds shut: the value reaches the
      # MODEL PROMPT, so it is a closed allowlist of labels this file
      # produces rather than free text like the times beside it - anything a
      # caller invents under the key is dropped, not interpolated; and the
      # dropdown must not appear for a city with one airport or none we
      # know, while still resolving what people actually type into a
      # free-text destinations field ("Roma", "NYC", "São Paulo", "KL").
      # Reverting the allowlist makes 2 of 61 red.
      - run: npm run test:airports
      # The job envelope, and when it counts as dead. Every reader did
      # `JSON.parse(raw) as Job` over a Redis value that outlives the deploy
      # that wrote it, and one bad record gave three different failures: the
      # polling route parsed OUTSIDE any try (an unhandled throw on an
      # endpoint hit every 400ms), a value that parsed but was not a job came
      # back 200 with nothing the client recognised (five minutes of
      # polling), and the worker's processJob dropped it without ever marking
      # it failed. And stallReason could not rescue any of it: `Date.now() -
      # undefined` is NaN and every comparison against NaN is false, so a job
      # stuck at "running" with a missing, NaN, Infinity or string updatedAt
      # was never stalled at ANY age - by the one function written to end
      # exactly that five-minute spinner. (`null` did stall, coercing to 0,
      # which is the tell the guard was accidental.) Reverting it makes 10 of
      # 55 red.
      - run: npm run test:job-record
      # The failure diagnostics, and the redaction that lets them exist.
      #
      # A failed generation tells the traveler one of seven sentences, and
      # the seventh - "Unexpected error generating itinerary." - is the
      # fallthrough in processJob's catch: the thrown value matched none of
      # the named cases. So the one failure class that by definition does
      # not say what happened was also the only one whose diagnosis needed
      # log access to the other deployment, and the last failed run's only
      # artifact was a screenshot of that sentence.
      #
      # The record is now written to Redis and rendered on /admin/health,
      # which is the exact pair the heartbeat refuses to let a credential
      # near - and an arbitrary client's error message is one of the few
      # strings in this process that carries one: ioredis names the target
      # it could not reach, and a Redis URL is
      # redis://default:<password>@host:6379. This suite is five real
      # credential shapes (including the Upstash REST token, which has no
