      # Login CSRF on the same endpoint.
      #
      # POST /api/auth/verify consumes a magic-link token and sets the
      # session cookie, and it accepted that POST from any origin. So an
      # attacker requests a link for THEIR OWN account, puts the token in a
      # form on a page they control, and gets a victim's browser to submit
      # it - the victim is then silently signed in as the attacker, and
      # every brief they type afterwards lands in an account the attacker
      # can read. `sameSite: "lax"` does not cover this: SameSite governs
      # whether a cookie is SENT cross-site, not whether a cross-site
      # request may SET one, and this route sets one.
      #
      # Closed by reading Origin and Sec-Fetch-Site, which page script
      # cannot set, remove or forge - a synchronizer token would mean a
      # Redis write and read per sign-in attempt to defend against
      # something the browser already tells us. A request carrying NEITHER
      # header is allowed, deliberately: an attack cannot manufacture that
      # (neither header can be stripped), while refusing it would break
      # sign-in on any client that sends neither.
