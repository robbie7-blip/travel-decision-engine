# Recovers the attribution for the destination photographs
# (scripts/recover-photo-credits.mjs). Run here rather than in a dev
# sandbox because it needs Wikimedia, which the sandbox cannot reach.
#
# It only READS: the generated credits file is printed to the log and
# uploaded as an artifact, then reviewed and committed by hand. A job that
# pushed attribution straight into the repo would skip the one step that
# matters - a person reading what it claims before it is published.
name: photo credits

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/photo-credits.yml
      - scripts/recover-photo-credits.mjs

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/recover-photo-credits.mjs
      - run: cat frontend/lib/destinationPhotoCredits.ts
      - uses: actions/upload-artifact@v4
        with:
          name: destination-photo-credits
          path: frontend/lib/destinationPhotoCredits.ts
